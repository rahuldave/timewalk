<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, Segoe UI, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4d5969"/></marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- browsers -->
  <text x="30" y="34" font-weight="700" fill="#17202b">Your browser</text>
  <rect x="30" y="46" width="260" height="78" rx="8" fill="#e4ebf9" stroke="#2456b5"/>
  <text x="46" y="72" font-weight="600" fill="#17202b">Projector page  /</text>
  <text x="46" y="94" fill="#4d5969">slides, files, reader, terminals</text>
  <text x="46" y="113" fill="#4d5969">sets each shell's size</text>
  <rect x="30" y="138" width="260" height="78" rx="8" fill="#e4ebf9" stroke="#2456b5"/>
  <text x="46" y="164" font-weight="600" fill="#17202b">Presenter page  /presenter</text>
  <text x="46" y="186" fill="#4d5969">the same page, plus clock band</text>
  <text x="46" y="205" fill="#4d5969">and your notes</text>

  <!-- server -->
  <rect x="360" y="46" width="250" height="300" rx="8" fill="#f6f7f9" stroke="#17202b" stroke-width="1.5"/>
  <text x="376" y="72" font-weight="700" fill="#17202b">timewalk server</text>
  <text x="376" y="92" fill="#6f7b8b" font-size="12.5">one process: uv run timewalk.py</text>
  <text x="376" y="112" fill="#6f7b8b" font-size="12.5">127.0.0.1 only, token on every request</text>
  <text x="376" y="142" font-weight="600" fill="#17202b">Shared state</text>
  <text x="376" y="162" fill="#4d5969">slide, layout, open file, view,</text>
  <text x="376" y="180" fill="#4d5969">terminal tab, clock</text>
  <text x="376" y="210" font-weight="600" fill="#17202b">Git layer</text>
  <text x="376" y="230" fill="#4d5969">read tags, move, diff, read files</text>
  <text x="376" y="260" font-weight="600" fill="#17202b">Edits watcher</text>
  <text x="376" y="280" fill="#4d5969">git status, once a second</text>
  <text x="376" y="310" font-weight="600" fill="#17202b">Shells</text>
  <text x="376" y="330" fill="#4d5969">one pseudo-terminal per tab</text>

  <line x1="290" y1="85" x2="358" y2="120" stroke="#4d5969" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="290" y1="177" x2="358" y2="150" stroke="#4d5969" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="296" y="140" fill="#6f7b8b" font-size="12">events</text>

  <!-- class folder -->
  <rect x="30" y="260" width="260" height="86" rx="8" fill="#fbefdd" stroke="#a85b00"/>
  <text x="46" y="286" font-weight="600" fill="#17202b">Your class folder</text>
  <text x="46" y="308" fill="#4d5969">notes.md, slides/slides.toml</text>
  <text x="46" y="327" fill="#4d5969">read afresh; never in git's way</text>
  <line x1="290" y1="303" x2="358" y2="303" stroke="#a85b00" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="300" y="296" fill="#a85b00" font-size="12">read</text>

  <!-- repositories -->
  <rect x="680" y="46" width="250" height="150" rx="8" fill="#e3f4ea" stroke="#1d7a4c"/>
  <text x="696" y="72" font-weight="700" fill="#17202b">Your repository</text>
  <text x="696" y="92" fill="#6f7b8b" font-size="12.5">~/code/project, on its own branch</text>
  <text x="696" y="118" fill="#4d5969">never moved by timewalk</text>
  <text x="696" y="138" fill="#4d5969">holds the commits and tags,</text>
  <text x="696" y="156" fill="#4d5969">and is never written to</text>
  <text x="696" y="182" font-weight="600" fill="#1d7a4c">Main tab runs here</text>

  <rect x="680" y="250" width="250" height="170" rx="8" fill="#e3f4ea" stroke="#1d7a4c" stroke-dasharray="6 4"/>
  <text x="696" y="276" font-weight="700" fill="#17202b">The replay copy</text>
  <text x="696" y="296" fill="#6f7b8b" font-size="12.5">~/code/project-replay, a git clone</text>
  <text x="696" y="322" fill="#4d5969">branch timewalk/replay at the step</text>
  <text x="696" y="342" fill="#4d5969">its own .venv, outputs, stashes</text>
  <text x="696" y="368" font-weight="600" fill="#1d7a4c">At this step, Runs, Claude, +</text>
  <text x="696" y="388" font-weight="600" fill="#1d7a4c">run here; the file view</text>
  <text x="696" y="406" font-weight="600" fill="#1d7a4c">and the watcher read here</text>

  <line x1="805" y1="196" x2="805" y2="248" stroke="#1d7a4c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="812" y="226" fill="#1d7a4c" font-size="12">fetches from</text>

  <line x1="610" y1="110" x2="678" y2="110" stroke="#4d5969" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="616" y="102" fill="#6f7b8b" font-size="12">tags</text>
  <line x1="610" y1="245" x2="678" y2="300" stroke="#4d5969" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="618" y="222" fill="#6f7b8b" font-size="12">checkout, diff,</text>
  <text x="618" y="237" fill="#6f7b8b" font-size="12">status</text>
  <line x1="610" y1="325" x2="678" y2="160" stroke="#1d7a4c" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="610" y1="330" x2="678" y2="380" stroke="#1d7a4c" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- legend / tabs -->
  <rect x="30" y="460" width="900" height="112" rx="8" fill="#ffffff" stroke="#d9dee6"/>
  <text x="46" y="486" font-weight="700" fill="#17202b">Where each tab's shell starts</text>
  <text x="46" y="512" fill="#4d5969"><tspan font-weight="600" fill="#17202b">At this step, Runs, Runs 2 to 9, +, Claude:</tspan> the replay copy. Their edits show live; their commands see the step's files.</text>
  <text x="46" y="536" fill="#4d5969"><tspan font-weight="600" fill="#17202b">Main:</tspan> your repository. Its edits are yours and never shown; its commands see the latest code, not the step's.</text>
  <text x="46" y="560" fill="#4d5969"><tspan font-weight="600" fill="#17202b">With --in-place:</tspan> there is no replay copy; every tab, Main included, is in your repository, which moves.</text>
</svg>
