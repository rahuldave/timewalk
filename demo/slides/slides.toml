# Which slides go with which step. Paths are beside this file.
#
# talk.md holds six slides, separated by lines that are exactly ---
#   "talk.md"       every slide in the file
#   "talk.md#2"     its second slide
#   "talk.md#2-3"   its second and third
# A picture or a page of a PDF can be a slide too: "shape.svg", "deck.pdf#page=4"

[slides]
step-00 = ["talk.md#1"]
step-01 = ["talk.md#2-3"]
step-02 = ["talk.md#4"]
step-03 = ["talk.md#5"]
step-04 = ["talk.md#6"]
