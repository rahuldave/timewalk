[project]
name = "timewalk"
version = "1.0.0"
description = "Browse a git repository one step at a time, with slides, notes and terminals, to teach how it was built"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
    "playwright>=1.45",
    "pypdf>=5",
]

[project.scripts]
timewalk = "timewalk:main"
timewalk-pdf = "timewalk.slides_pdf:main"

[project.urls]
Homepage = "https://rahuldave.com/timewalk/"
Repository = "https://github.com/rahuldave/timewalk"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timewalk"]
