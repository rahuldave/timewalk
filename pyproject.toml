[project]
name = "timewalk"
version = "1.4.0"
description = "Browse a git repository one step at a time, with slides, notes and terminals, to teach how it was built"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
    "playwright>=1.45",
    "pypdf>=5",
]

[project.scripts]
timewalk = "timewalk:main"
timewalk-pdf = "timewalk.slides_pdf:main"
timewalk-export = "timewalk.export:main"
timewalk-check = "timewalk.walks:main"
timewalk-notes = "timewalk.walks:notes_main"

[project.urls]
Homepage = "https://rahuldave.com/timewalk/"
Repository = "https://github.com/rahuldave/timewalk"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-timeout>=2.3",
    "jsonschema>=4.26.0",
]

[tool.uv]
# uvx --from a working copy rebuilds timewalk when one of these changes. By default uv looks at pyproject.toml alone, so a
# new commit with the same version ran the old build from uv's cache. The static files are the page's; __pycache__ is not counted.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/timewalk/static/**/*" }, { file = "src/timewalk/*.json" }, { git = { commit = true } }]

[tool.pytest.ini_options]
# A test that waits on a socket fails after a minute, with a traceback, and never hangs the run.
timeout = 60

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timewalk"]
