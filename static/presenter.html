<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>timewalk presenter</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="presenter">
  <div class="p-wrap">
    <div class="p-top">
      <button id="prev" class="nav" title="Previous step (Shift+Left)">&#9664; Step</button>
      <div class="p-step">
        <span id="step-name" class="step-name"></span>
        <span id="step-subject" class="step-subject"></span>
      </div>
      <div class="clock" aria-live="off">
        <span id="elapsed" class="elapsed">0:00</span>
        <span id="plan" class="plan"></span>
        <button id="clock-start">Start the clock</button>
      </div>
      <button id="next" class="nav next" title="Next step (Shift+Right). The Right arrow alone advances a slide first">Step &#9654;</button>
    </div>

    <div id="notice" class="notice" hidden></div>

    <div class="p-grid">
      <section class="p-card">
        <h2>Your notes for this step</h2>
        <div id="notes" class="p-notes"></div>
      </section>

      <div class="p-side">
        <section class="p-card" id="slides-card">
          <h2>Slides for this step</h2>
          <div class="p-slides">
            <div class="row">
              <button id="slide-prev">&#9650; Slide</button>
              <button id="slide-next">Slide &#9660;</button>
              <span id="slide-count" class="plan"></span>
            </div>
            <div id="slide-preview" class="p-preview"></div>
            <ol id="slide-list"></ol>
            <div class="row">
              <span class="plan">Projector shows</span>
              <button data-layout="slides">Slides</button>
              <button data-layout="split">Both</button>
              <button data-layout="code">Code</button>
            </div>
          </div>
        </section>
        <section class="p-card">
          <h2>Commands, sent to the projector's terminal</h2>
          <div id="commands" class="p-commands"></div>
        </section>
        <section class="p-card">
          <h2>Files this step changed, shown on the projector</h2>
          <div id="files" class="p-files"></div>
        </section>
        <section class="p-card">
          <h2>What the audience sees as this step's note</h2>
          <div id="public" class="p-public"></div>
        </section>
        <section class="p-card p-next">
          <h2>Next</h2>
          <div id="upcoming"></div>
        </section>
      </div>
    </div>
  </div>
  <script type="module" src="/static/presenter.js"></script>
</body>
</html>
