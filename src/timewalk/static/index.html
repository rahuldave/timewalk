<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>timewalk</title>
  <link rel="stylesheet" href="/static/vendor/highlight/github.min.css" id="hl-light">
  <link rel="stylesheet" href="/static/vendor/highlight/github-dark.min.css" id="hl-dark" disabled>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <!-- With --clock: the clock and what comes next, across the top. -->
  <div id="band" class="band" hidden>
    <span class="band-label">Clock</span>
    <span id="elapsed" class="elapsed">0:00</span>
    <span id="plan" class="plan"></span>
    <button id="clock-start">Start the clock</button>
    <span id="upcoming" class="upcoming"></span>
  </div>

  <header class="bar">
    <select id="walk-picker" class="walk-picker" hidden aria-label="Walk" title="The walk: one path through the history, with its own notes and slides. A change moves every window"></select>
    <span id="walk-kind" class="walk-kind" hidden></span>
    <span id="move-modes" class="move-modes" role="group" aria-label="How the moves of this tutorial go" hidden>
      <button data-mode="do" aria-pressed="true" title="Do: make each move by hand, from the notes, and press Done">Do</button>
      <button data-mode="watch" aria-pressed="false" title="Watch: timewalk checks out each move's commit">Watch</button>
    </span>
    <span id="walk-title" class="walk-title" hidden></span>
    <div class="steps">
      <button id="prev" class="nav" title="Previous step (Left arrow; Alt+Left inside a terminal)" aria-label="Previous step">&#9664;</button>
      <ol id="step-list" aria-label="Steps"></ol>
      <button id="next" class="nav" title="Next step (Right arrow; Alt+Right inside a terminal)" aria-label="Next step">&#9654;</button>
    </div>
    <div class="where">
      <span id="step-name" class="step-name"></span>
      <span id="step-subject" class="step-subject"></span>
    </div>
    <div class="tools">
      <span id="mode" class="mode" hidden title="timewalk was started with --discard-edits: a move throws away edits to tracked files, without asking"></span>
      <button id="notes-toggle" hidden aria-pressed="true" title="Show or hide the notes beside the page (Alt+\). Each window remembers its own choice">Notes</button>
      <button id="cues-toggle" hidden aria-pressed="true" title="Show or hide the cues, the lines of the notes that start with &gt;. Hide them in the window that the class sees. Each window remembers its own choice">Cues</button>
      <button id="room" title="Open the window for the class: on the projector, full size, without your cues and without the clock. The page asks once to place windows on your screens">Room</button>
      <button id="fullscreen" hidden title="Fill the screen with this window. Press Escape to leave">Full screen</button>
      <button id="pdf" hidden title="Make a PDF of the slides, one page each, and download it">PDF</button>
      <button id="shell-toggle" aria-pressed="false" title="Give the terminals the space of the slides and the files, in every window (Alt+Enter)">Shell</button>
      <span id="layouts" class="layouts" role="group" aria-label="What to show" hidden>
        <span class="group-label" aria-hidden="true">Show</span>
        <button data-layout="slides" title="Slides only (Alt+1; Alt+` switches between Slides and Code)">Slides</button>
        <button data-layout="split" title="Slides beside the code (Alt+2)">Both</button>
        <button data-layout="code" title="Code only (Alt+3; Alt+` switches between Slides and Code)">Code</button>
      </span>
      <button id="smaller" title="Smaller text" aria-label="Smaller text">A&minus;</button>
      <button id="larger" title="Larger text" aria-label="Larger text">A+</button>
      <button id="theme" title="Switch between light and dark">Dark</button>
    </div>
    <nav id="moves" class="moves" hidden aria-label="Moves of this step"></nav>
  </header>

  <div id="notice" class="notice" hidden></div>
  <p id="note" class="note" hidden></p>

  <main class="panes">
    <section class="slide-pane" id="slide-pane">
      <div class="pane-head">
        <span id="slide-count">Slides</span>
        <button class="to-top" data-pane="slide" hidden title="Back to the top of the slide (Home)">&#8593; Top</button>
        <span class="views" id="slide-arrows">
          <button id="slide-first" hidden title="The first slide of this step (Shift+Up)" aria-label="First slide">&#8676; First</button>
          <button id="slide-prev" title="Previous slide (Up arrow; Alt+Up inside a terminal)" aria-label="Previous slide">&#9650;</button>
          <button id="slide-next" title="Next slide (Down arrow; Alt+Down inside a terminal)" aria-label="Next slide">&#9660;</button>
        </span>
      </div>
      <div id="slide" class="slide"></div>
    </section>

    <div class="col-resizer" id="resize-slides" role="separator" aria-orientation="vertical" title="Drag to change the width of the slides. Double-click to reset"></div>

    <aside class="tree-pane" id="tree-pane">
      <div class="pane-head">
        <span id="tree-summary">Files</span>
        <label class="only"><input type="checkbox" id="only-changed"> changed or edited</label>
      </div>
      <nav id="tree" aria-label="Files"></nav>
    </aside>

    <div class="col-resizer" id="resize-files" role="separator" aria-orientation="vertical" title="Drag to change the width of the file list. Double-click to reset"></div>

    <section class="file-pane">
      <div class="pane-head">
        <span id="file-path" class="file-path">Choose a file</span>
        <button class="to-top" data-pane="file" hidden title="Back to the top of the file (Home)">&#8593; Top</button>
        <span class="views" role="tablist">
          <button id="view-file" role="tab" aria-selected="true">File</button>
          <button id="view-diff" role="tab" aria-selected="false">Changes in this step</button>
          <button id="view-edits" role="tab" aria-selected="false" hidden title="What commands run here, such as a formatter, have changed in this file since the step's commit. Not committed">Edits since the step</button>
        </span>
      </div>
      <div id="file-body" class="file-body"><p class="empty">Files are shown as they are at this step. They cannot be edited here.</p></div>
    </section>
  </main>

  <div id="divider" class="divider" title="Drag to resize the terminal" role="separator" aria-orientation="horizontal"></div>

  <section class="term-pane" id="term-pane">
    <div class="pane-head">
      <span id="tabs" class="tabs" role="tablist"></span>
      <button id="add-tab" title="Open another shell at this step" aria-label="Open another shell">+</button>
      <span id="recipes" class="recipes" aria-label="just recipes"></span>
    </div>
    <div id="terms" class="terms"></div>
  </section>

  <!-- With --notes: the notes of the step and their commands, on the right. The Notes button hides them. -->
  <aside id="notes-pane" class="notes-pane" hidden>
    <div class="notes-resizer" id="resize-notes" role="separator" title="Drag to change the size of the notes. Double-click to reset"></div>
    <div class="pane-head">
      <span id="notes-title">Notes</span>
      <span class="notes-tools">
        <button class="to-top" data-pane="notes" hidden title="Back to the top of the notes (Home)">&#8593; Top</button>
        <label class="only" title="When on, a click on a command also presses Enter. When off, it only types the command, for you to read and run"><input type="checkbox" id="run-on-click"> run on click</label>
        <button id="notes-edit" title="Edit the notes of this step, in the notes file">Edit</button>
      </span>
    </div>
    <div id="notes-editor" class="notes-editor" hidden>
      <textarea id="notes-text" spellcheck="true" aria-label="The notes of this step, as Markdown"></textarea>
      <div class="notes-editor-tools">
        <button id="notes-save">Save</button>
        <button id="notes-cancel">Cancel</button>
        <span id="notes-file" class="p-empty"></span>
      </div>
    </div>
    <div class="notes-body" id="notes-body">
      <div id="notes" class="p-notes"></div>
    </div>
  </aside>

  <script src="/static/vendor/highlight/highlight.min.js"></script>
  <script src="/static/vendor/highlight/dockerfile.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
